<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — mondns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f1117; color: #e2e8f0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .card-box { background: #161b27; border: 1px solid #1e2a3a;
                border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; }
    .brand-icon { font-size: 2.5rem; color: #60a5fa; }
    .form-control { background: #0f1117; border-color: #1e2a3a; color: #e2e8f0; }
    .form-control:focus { background: #0f1117; border-color: #3b82f6; color: #e2e8f0;
                          box-shadow: 0 0 0 .2rem rgba(59,130,246,.25); }
    .form-label { color: #94a3b8; font-size: .85rem; }
    .btn-primary { background: #2563eb; border-color: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .strength-bar { height: 4px; border-radius: 2px; transition: width .3s, background .3s; }
  </style>
</head>
<body>
  <div class="card-box shadow-lg">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock brand-icon"></i>
      <h5 class="mt-2 fw-bold text-light">Redefinir senha</h5>
      <p class="text-secondary small mb-0">mondns — DNS DDoS Monitor</p>
    </div>

    {% if done %}
    <div class="alert alert-success d-flex align-items-center gap-2 py-2" role="alert">
      <i class="bi bi-check-circle-fill"></i>
      <span>Senha redefinida com sucesso!</span>
    </div>
    <div class="text-center mt-3">
      <a href="/login" class="btn btn-primary btn-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i>Ir para o login
      </a>
    </div>

    {% elif not valid %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>Link inválido ou expirado. Solicite um novo link de redefinição.</span>
    </div>
    <div class="text-center mt-3">
      <a href="/forgot-password" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-key me-1"></i>Solicitar novo link
      </a>
    </div>

    {% else %}
    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/reset-password" autocomplete="off">
      <input type="hidden" name="token" value="{{ token }}">

      <div class="mb-3">
        <label for="password" class="form-label">Nova senha</label>
        <div class="input-group">
          <span class="input-group-text" style="background:#1e2a3a;border-color:#1e2a3a;color:#64748b">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="mínimo 8 caracteres" required autofocus autocomplete="new-password"
                 oninput="checkStrength(this.value)">
          <button type="button" class="btn btn-outline-secondary" onclick="toggleVis('password', this)" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="mt-1 px-1">
          <div class="d-flex gap-1">
            <div id="bar1" class="strength-bar flex-fill" style="background:#1e2a3a;width:100%"></div>
            <div id="bar2" class="strength-bar flex-fill" style="background:#1e2a3a;width:100%"></div>
            <div id="bar3" class="strength-bar flex-fill" style="background:#1e2a3a;width:100%"></div>
            <div id="bar4" class="strength-bar flex-fill" style="background:#1e2a3a;width:100%"></div>
          </div>
          <small id="strength-label" class="text-secondary" style="font-size:.75rem"></small>
        </div>
      </div>

      <div class="mb-4">
        <label for="password2" class="form-label">Confirmar nova senha</label>
        <div class="input-group">
          <span class="input-group-text" style="background:#1e2a3a;border-color:#1e2a3a;color:#64748b">
            <i class="bi bi-lock-fill"></i>
          </span>
          <input type="password" id="password2" name="password2" class="form-control"
                 placeholder="repita a senha" required autocomplete="new-password">
          <button type="button" class="btn btn-outline-secondary" onclick="toggleVis('password2', this)" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-check-lg me-2"></i>Redefinir senha
      </button>
    </form>
    {% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleVis(id, btn) {
      const inp = document.getElementById(id);
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
      } else {
        inp.type = 'password';
        btn.innerHTML = '<i class="bi bi-eye"></i>';
      }
    }

    function checkStrength(val) {
      let score = 0;
      if (val.length >= 8) score++;
      if (val.length >= 12) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      score = Math.min(score, 4);

      const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
      const labels = ['Muito fraca','Fraca','Moderada','Forte'];
      const bars = ['bar1','bar2','bar3','bar4'];
      bars.forEach((id, i) => {
        document.getElementById(id).style.background = i < score ? colors[score - 1] : '#1e2a3a';
      });
      document.getElementById('strength-label').textContent = val.length ? labels[Math.max(score-1,0)] : '';
    }
  </script>
</body>
</html>
