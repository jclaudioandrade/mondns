<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — mondns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f1117; color: #e2e8f0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .login-card { background: #161b27; border: 1px solid #1e2a3a;
                  border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; }
    .brand-icon { font-size: 2.5rem; color: #60a5fa; }
    .form-control { background: #0f1117; border-color: #1e2a3a; color: #e2e8f0; }
    .form-control:focus { background: #0f1117; border-color: #3b82f6; color: #e2e8f0;
                          box-shadow: 0 0 0 .2rem rgba(59,130,246,.25); }
    .form-label { color: #94a3b8; font-size: .85rem; }
    .btn-primary { background: #2563eb; border-color: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .version-badge { font-size: .7rem; color: #475569; }
  </style>
</head>
<body>
  <div class="login-card shadow-lg">
    <div class="text-center mb-4">
      <i class="bi bi-shield-shaded brand-icon"></i>
      <h4 class="mt-2 fw-bold text-light">mondns</h4>
      <p class="text-secondary small mb-0">DNS DDoS Monitor</p>
      <p class="text-secondary small version-badge">Acesso restrito — somente usuários autorizados</p>
    </div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login" autocomplete="off">
      <div class="mb-3">
        <label for="username" class="form-label">Usuário</label>
        <div class="input-group">
          <span class="input-group-text" style="background:#1e2a3a;border-color:#1e2a3a;color:#64748b">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" id="username" name="username" class="form-control"
                 placeholder="Usuário" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Senha</label>
        <div class="input-group">
          <span class="input-group-text" style="background:#1e2a3a;border-color:#1e2a3a;color:#64748b">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="Senha" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="/forgot-password" class="text-secondary" style="font-size:.8rem;text-decoration:none">
        <i class="bi bi-key me-1"></i>Esqueci minha senha
      </a>
    </div>

    <div class="text-center mt-3">
      <span class="text-secondary" style="font-size:.7rem">
        <i class="bi bi-shield-lock me-1"></i>
        Sessão protegida • mondns v0.2.0
      </span>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
