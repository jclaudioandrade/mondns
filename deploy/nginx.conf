# /etc/nginx/conf.d/mondns.conf
# mondns — mondns.sondaativas.com.br
# Responsavel: mondns user | Cert: wildcard *.sondaativas.com.br (Sectigo, expira 2027-03-04)
# Proxy reverso para: 127.0.0.1:8003

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name mondns.sondaativas.com.br;
    return 301 https://$host$request_uri;
}

# HTTPS — Virtual Host Principal
server {
    listen 443 ssl http2;
    server_name mondns.sondaativas.com.br;

    ssl_certificate     /home/cert/projetos/cert/nginx/ssl/cert.pem;
    ssl_certificate_key /home/cert/projetos/cert/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_mondns:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net unpkg.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; font-src 'self' cdn.jsdelivr.net;" always;

    client_max_body_size 10M;

    access_log /var/log/nginx/mondns.access.log;
    error_log  /var/log/nginx/mondns.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
    }

    location /health {
        proxy_pass         http://127.0.0.1:8003/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|key|pem|crt|p12|pfx|db|sqlite)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
