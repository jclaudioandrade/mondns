# ============================================================
# mondns — Nginx Virtual Host
# Subdomínio: mondns.sondaativas.com.br
# Certificado: wildcard *.sondaativas.com.br (Sectigo, válido até 2027)
# Proxy reverso para: 127.0.0.1:8002
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mondns.sondaativas.com.br;

    # ACME challenge (renovação de certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Virtual Host Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mondns.sondaativas.com.br;

    # ----------------------------------------------------------
    # Certificado SSL — Wildcard *.sondaativas.com.br (Sectigo)
    # ----------------------------------------------------------
    ssl_certificate     /home/mondns/projetos/mondns/nginx/ssl/fullchain.pem;
    ssl_certificate_key /home/mondns/projetos/mondns/nginx/ssl/privkey.pem;

    # Configurações SSL recomendadas (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:mondns_SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ----------------------------------------------------------
    # Headers de Segurança HTTP
    # ----------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Ocultar versão do Nginx
    server_tokens off;

    # ----------------------------------------------------------
    # Rate Limiting (definir zona no nginx.conf principal)
    # Adicionar no contexto http do nginx.conf principal:
    #   limit_req_zone $binary_remote_addr zone=mondns_api:10m rate=100r/m;
    #   limit_req_zone $binary_remote_addr zone=mondns_auth:10m rate=10r/m;
    # ----------------------------------------------------------
    # limit_req zone=mondns_api burst=20 nodelay;

    # ----------------------------------------------------------
    # Logs
    # ----------------------------------------------------------
    access_log /var/log/nginx/mondns.access.log combined;
    error_log  /var/log/nginx/mondns.error.log warn;

    # ----------------------------------------------------------
    # Proxy Reverso → Aplicação (127.0.0.1:8002)
    # ----------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffers
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;

        # Remover headers internos antes de encaminhar ao cliente
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
    }

    # Endpoint de health check (sem rate limit)
    location /health {
        proxy_pass         http://127.0.0.1:8002/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ----------------------------------------------------------
    # Rate limiting específico para autenticação
    # ----------------------------------------------------------
    location /api/v1/auth/ {
        # limit_req zone=mondns_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # Bloquear acesso a arquivos sensíveis
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|key|pem|crt|p12|pfx|db|sqlite)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
